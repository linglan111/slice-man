appId: local.sliceman.desktop
productName: Slice Man
directories:
  output: dist
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
extraResources:
  - from: LICENSE
    to: notices/Slice-Man-LICENSE.txt
  - from: resources/icons
    to: icons
  - from: resources/runtime-smoke.wav
    to: runtime-smoke.wav
  - from: resources/media
    to: media
  - from: resources/fonts
    to: fonts
  - from: resources/notices
    to: notices
win:
  icon: resources/icons/icon.ico
  target:
    - target: nsis
      arch: x64
  signAndEditExecutable: true
  signExecutable: false
nsis:
  installerIcon: resources/icons/icon.ico
  uninstallerIcon: resources/icons/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
forceCodeSigning: false
npmRebuild: true
