name: Publish Slice Man

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slice-man-production-release
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.repository == 'linglan111/slice-man' &&
      github.ref == 'refs/heads/release' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.17.0
      - name: Test release policy
        run: node --test scripts/release.test.cjs
      - name: Check version and existing release
        id: plan
        run: node scripts/release.cjs plan
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: plan
    if: >-
      needs.plan.outputs.publish == 'true' &&
      github.repository == 'linglan111/slice-man' &&
      github.ref == 'refs/heads/release' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.17.0
          cache: npm
      - run: npm ci
      - run: npm run setup:resources
      - run: npm run setup:whisper-fixtures
      - run: npm run setup:download-fixtures
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - name: Build Windows installer without publishing
        run: npm run make -- --publish never --config.directories.output=dist/release
      - name: Verify packaged application startup
        run: npm run test:package -- --app-dir dist/release/win-unpacked
      - name: Prepare installer and checksum
        run: node scripts/release.cjs artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slice-man-${{ needs.plan.outputs.version }}
          path: |
            dist/release/Slice-Man-Setup-*.exe
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [plan, build]
    if: >-
      needs.plan.outputs.publish == 'true' &&
      needs.build.result == 'success' &&
      github.repository == 'linglan111/slice-man' &&
      github.ref == 'refs/heads/release' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.17.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: slice-man-${{ needs.plan.outputs.version }}
          path: dist/release
      - name: Verify checksum, create draft, upload, then publish
        run: node scripts/release.cjs publish
        env:
          GH_TOKEN: ${{ github.token }}
